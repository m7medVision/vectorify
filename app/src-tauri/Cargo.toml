[package]
name = "vectorify"
version = "0.1.0"
edition = "2021"
description = "Vectorify desktop app (Tauri backend)"

[[bin]]
name = "vectorify"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
domain = { path = "../../domain" }
application = { path = "../../application" }
infrastructure = { path = "../../infrastructure" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
